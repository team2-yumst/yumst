name: Recommendation Server Deployment To AWS

on:
  push:
    branches:
      - production
    paths:
      - 'recommendationServer/**'
permissions:
  contents: read

jobs:
  CI-CD:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./recommendationServer
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

      # docker login
    - name: Docker Hub Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # docker build & push to production
    - name: Docker build & push to prod
      run: |
        docker build -f Dockerfile -t gothax2/yumst-recommend .
        docker push gothax2/yumst-recommend

    ## deploy to production
    - name: Deploy to prod
      uses: appleboy/ssh-action@master
      id: deploy-prod
      with:
        host: ${{ secrets.RECOMMEND_HOST_PROD }} # EC2 퍼블릭 IPv4 DNS
        username: ubuntu
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        envs: GITHUB_SHA
        script: |
          sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p '${{ secrets.DOCKER_PASSWORD }}'
          sudo docker rm -f $(sudo docker ps -qa)
          sudo docker pull gothax2/yumst-recommend:latest
          sudo docker-compose up -d
          sudo docker image prune -f

