name: Backend Deployment To AWS

on:
  push:
    branches:
      - production
    paths:
      - 'be/**'
permissions:
  contents: read

jobs:
  CI-CD:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./be
    steps:
    # JDK setting - github actions에서 사용할 JDK 설정 (aws 과 project의 java 버전과 별도로 관리)
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'
        
    ## gradle caching (빌드 시간 줄이기)
    - name: Gradle Caching
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle
    
    # setup yml
    - name: Setup yml
      run: |
        touch ./src/main/resources/application-prod.yml
        echo "${{ secrets.APPLICATION_PROD }}" > ./src/main/resources/application-prod.yml
        touch ./src/main/resources/application-jwt.yml
        echo "${{ secrets.APPLICATION_JWT }}" > ./src/main/resources/application-jwt.yml
        touch ./src/main/resources/application-oauth.yml
        echo "${{ secrets.APPLICATION_OAUTH }}" > ./src/main/resources/application-oauth.yml

    # gradle chmod
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # gradle build
    - name: Build with Gradle
      run: ./gradlew clean build -x test

      # docker login
    - name: Docker Hub Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # docker build & push to production
    - name: Docker build & push to prod
      run: |
        docker build -f Dockerfile -t gothax2/yumst-docker-repository .
        docker push ${{ secrets.DOCKER_USERNAME }}/yumst-docker-repository

    ## deploy to production
    - name: Deploy to prod
      uses: appleboy/ssh-action@master
      id: deploy-prod
      with:
        host: ${{ secrets.HOST_PROD }} # EC2 퍼블릭 IPv4 DNS
        username: ubuntu
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        envs: GITHUB_SHA
        script: |
          sudo docker rm -f $(docker ps -qa)
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/yumst-docker-repository
          sudo docker-compose up -d
          sudo docker image prune -f

